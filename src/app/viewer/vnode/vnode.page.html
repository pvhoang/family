<ion-content [fullscreen]="true">

	<div class="page" data-density="hard">
		<div class="page-content">
			<h1 class="page-header">{{title}}</h1>
			<br>

			<ion-item class="page-header-ng-select">

				<ion-col size="1" class="heading" (click)="onExit()">
					<ion-button class="button" fill="clear">
						<ion-icon slot="icon-only" src="{{FONTS_FOLDER}}close-circle-outline.svg" class="icon"></ion-icon>
					</ion-button>
				</ion-col>

				<ion-col size="9" class="ng-select-item">
					<ng-select 
						class="mobileClass"
						[appendTo]="'body'"
						[items]="peopleNodes" 
						placeholder="{{selectPeoplePlaceholder}}"
						[(ngModel)]="selectPeople"
						(close)="closePeopleNodes()"
						(clear)="clearPeopleNodes()"
						(keyup)="keyupPeopleNodes($event)"
					>
					</ng-select>
				</ion-col>

				<ion-col size="2" class="heading" (click)="onViewChange()">
					<ion-button class="button" fill="clear" >
						<!-- <ion-icon slot="icon-only" src="{{FONTS_FOLDER}}family-tree.svg" class="icon"></ion-icon> -->
						<ion-icon slot="icon-only" src="{{treeIcon}}" class="icon"></ion-icon>
					</ion-button>
				</ion-col>

			</ion-item>

			<div class="w3-container page-text scroll">
				<!-- <div id="full-tree"> -->
					<!-- <div [ngStyle]="ftTreeService.getZoomStyle()"> -->
						<ft-tree (onLeafSelected)="onLeafSelected($event)" [family]="familyView" [view]="viewMode" [class]="treeClass"></ft-tree>
					<!-- </div> -->
				<!-- </div> -->
			</div>
		</div>
	</div>

</ion-content>
