<ion-content [fullscreen]="true">

	<div class="page" data-density="hard">
		<div class="page-content">
			<h1 class="page-header">Tree</h1>
			<br>

			<ion-item class="page-header-ng-select">

				<ion-col size="2" class="heading" (click)="onCancel()">
					<ion-button class="button" fill="clear">
						<ion-icon slot="icon-only" class="icon" src="{{FONTS_FOLDER}}close-circle-outline.svg" ></ion-icon>
					</ion-button>
				</ion-col>

				<ion-col size="8" class="heading">
					<span class="label"><b>{{ title }}</b></span>
				</ion-col>

				<ion-col *ngIf="platform == 'web'" size="2" class="heading" (click)="onPDF()">
					<ion-button class="button" title="{{ PDF }}" fill="clear">
						<ion-icon slot="icon-only" class="icon" src="{{FONTS_FOLDER}}file-pdf-box.svg"></ion-icon>
					</ion-button>
				</ion-col>

				<ion-col *ngIf="platform !== 'web'" size="2">
				</ion-col>
			
			</ion-item>

			<div class="w3-container page-text scroll">

				<div id="screen">
					<!-- <div [ngStyle]="ftTreeService.getZoomStyle()" id="screen"> -->
						<ft-tree (onLeafSelected)="onLeafSelected($event)" [family]="familyView" [view]="viewMode" [class]="treeClass"></ft-tree>
					<!-- </div> -->
				</div>

				<!-- <ft-tree (onLeafSelected)="onLeafSelected($event)" [family]="familyView" [view]="viewMode" [class]="treeClass"></ft-tree> -->
